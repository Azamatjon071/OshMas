<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshMas - Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Uzbek Pattern Overlay -->
    <div class="uzbek-pattern-overlay"></div>

    <!-- Header Section -->
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="images/logo.png" alt="OshMas Logo" height="40">
                    OshMas
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#features">Xizmatlar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#premium">Premium</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="profile.html">Profil</a>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-outline-primary" id="logoutBtn">Chiqish</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Profile Section -->
    <section class="profile-section">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="profile-card">
                        <div class="profile-image">
                            <img src="images/default-avatar.png" alt="Profil rasmi" class="img-fluid">
                            <button class="btn btn-outline-primary btn-sm mt-2" id="changeAvatarBtn">
                                <i class="fas fa-camera"></i> Rasmni o'zgartirish
                            </button>
                        </div>
                        <div class="profile-info">
                            <h2 id="userName">Foydalanuvchi ismi</h2>
                            <p class="text-muted" id="userEmail">email@example.com</p>
                            <p class="diabetes-type" id="userDiabetesType">1-tur diabet</p>
                            <p class="registration-date" id="userRegistrationDate">Ro'yxatdan o'tgan sana</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="profile-settings">
                        <h3>Profil sozlamalari</h3>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label for="editName" class="form-label">Ism</label>
                                <input type="text" class="form-control" id="editName">
                            </div>
                            <div class="mb-3">
                                <label for="editEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail">
                            </div>
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Joriy parol</label>
                                <input type="password" class="form-control" id="currentPassword">
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Yangi parol</label>
                                <input type="password" class="form-control" id="newPassword">
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Yangi parolni tasdiqlang</label>
                                <input type="password" class="form-control" id="confirmPassword">
                            </div>
                            <button type="submit" class="btn btn-primary">O'zgarishlarni saqlash</button>
                        </form>
                    </div>

                    <div class="profile-stats mt-4">
                        <h3>Statistika</h3>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <i class="fas fa-utensils"></i>
                                    <h4 id="mealsCount">0</h4>
                                    <p>Ovqatlar</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <i class="fas fa-chart-line"></i>
                                    <h4 id="glucoseLevel">0</h4>
                                    <p>Qon shakari</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <i class="fas fa-calendar-check"></i>
                                    <h4 id="daysActive">0</h4>
                                    <p>Faol kunlar</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
